name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the toolchain image
        # ci/Dockerfile, the same image `make test` uses locally. The layer
        # cache lives in the GitHub Actions cache, so a run that doesn't
        # change build.gradle/settings.gradle reuses the warmed dependencies.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          target: toolchain
          tags: otelfeature-java-extension-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and test
        # The same command as `make test`.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD":/src -w /src otelfeature-java-extension-ci
          gradle --no-daemon --offline build

      - name: Verify shaded service files
        # This has already failed silently once: shadow's default EXCLUDE
        # duplicates strategy dropped gRPC's DnsNameResolverProvider before
        # mergeServiceFiles() could merge it, leaving the extension unable to
        # resolve "flagd:8015" - and neither the compiler nor the tests
        # noticed. A plugin upgrade could reintroduce it just as quietly.
        run: |
          jar=build/libs/otelfeature-java-extension.jar
          check() {
            if unzip -p "$jar" "META-INF/services/$1" | grep -qF "$2"; then
              echo "ok: $1 provides $2"
            else
              echo "::error::$jar: META-INF/services/$1 does not list $2"
              exit 1
            fi
          }
          # Without this one the extension is never discovered by the agent.
          check io.opentelemetry.sdk.autoconfigure.spi.AutoConfigurationCustomizerProvider io.otelfeature.OtelfeatureCustomizer
          # Without these the gRPC channel to flagd cannot be built or resolved.
          check io.grpc.ManagedChannelProvider NettyChannelProvider
          check io.grpc.NameResolverProvider DnsNameResolverProvider

      - name: Upload JAR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otelfeature-java-extension
          path: build/libs/otelfeature-java-extension.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag must match build.gradle: v0.4.0 for version '0.4.0'. A
      # release candidate v0.4.0-rc.N of the same version is accepted too and
      # becomes a pre-release, so the release path can be rehearsed first.
      - name: Check tag matches build.gradle version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          re="^v${version//./[.]}(-rc[.][0-9]+)?$"
          if [ -z "$version" ] || ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag $TAG does not match build.gradle version $version"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          target: toolchain
          tags: otelfeature-java-extension-ci
          load: true
          cache-from: type=gha

      - name: Build and test
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD":/src -w /src otelfeature-java-extension-ci
          gradle --no-daemon --offline build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: build/libs/otelfeature-java-extension.jar
