name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Pinned rather than relying on whatever the runner image ships:
          # the shadow plugin requires Gradle 9.0+.
          gradle-version: '9.7.1'

      - name: Build and test
        run: gradle build --no-daemon

      - name: Verify shaded service files
        # This has already failed silently once: shadow's default EXCLUDE
        # duplicates strategy dropped gRPC's DnsNameResolverProvider before
        # mergeServiceFiles() could merge it, leaving the extension unable to
        # resolve "flagd:8015" - and neither the compiler nor the tests
        # noticed. A plugin upgrade could reintroduce it just as quietly.
        run: |
          jar=build/libs/otelfeature-java-extension.jar
          check() {
            if unzip -p "$jar" "META-INF/services/$1" | grep -qF "$2"; then
              echo "ok: $1 provides $2"
            else
              echo "::error::$jar: META-INF/services/$1 does not list $2"
              exit 1
            fi
          }
          # Without this one the extension is never discovered by the agent.
          check io.opentelemetry.sdk.autoconfigure.spi.AutoConfigurationCustomizerProvider io.otelfeature.OtelfeatureCustomizer
          # Without these the gRPC channel to flagd cannot be built or resolved.
          check io.grpc.ManagedChannelProvider NettyChannelProvider
          check io.grpc.NameResolverProvider DnsNameResolverProvider

      - name: Upload JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otelfeature-java-extension
          path: build/libs/otelfeature-java-extension.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Pinned rather than relying on whatever the runner image ships:
          # the shadow plugin requires Gradle 9.0+.
          gradle-version: '9.7.1'

      - name: Build and test
        run: gradle build --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: build/libs/otelfeature-java-extension.jar
