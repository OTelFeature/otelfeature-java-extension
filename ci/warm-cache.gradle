// Init script for ci/Dockerfile: download every dependency the build can need,
// artifacts included, into the Gradle user home.
//
// `gradle dependencies` alone is not enough: it resolves the dependency
// *graph* (POMs/modules) but not the JARs, so an --offline build in the image
// would still miss them. Resolving each resolvable configuration fetches the
// files too. Plugins (shadow) are already on the build script classpath by
// the time this runs.
allprojects {
    afterEvaluate { project ->
        project.configurations
                .findAll { it.canBeResolved }
                .each { configuration ->
                    try {
                        configuration.resolve()
                    } catch (Exception e) {
                        logger.warn("warm-cache: skipped ${project.path}:${configuration.name}: ${e.message}")
                    }
                }
    }
}
