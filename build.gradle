plugins {
    id 'java-library'
}

group = 'io.otelfeature'
version = '0.2.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The OTel SDK and autoconfigure SPI are provided by the agent
    // at runtime. We only need them at compile time.
    compileOnly 'io.opentelemetry:opentelemetry-api:1.65.0'
    compileOnly 'io.opentelemetry:opentelemetry-sdk:1.65.0'
    compileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.65.0'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'io.opentelemetry:opentelemetry-api:1.65.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk:1.65.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.65.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.65.0'
}

jar {
    archiveFileName = 'otelfeature-java-extension.jar'
}

test {
    useJUnitPlatform()
}
