plugins {
    id 'java-library'
    // Produces the single self-contained extension JAR. Needed for more than
    // the one relocation below: gRPC discovers ManagedChannelProvider and
    // NameResolverProvider through META-INF/services, and a naive fat JAR would
    // let one dependency's service file overwrite another's.
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'io.otelfeature'
version = '0.5.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The OTel SDK and autoconfigure SPI are provided by the agent
    // at runtime. We only need them at compile time.
    compileOnly 'io.opentelemetry:opentelemetry-api:1.67.0'
    compileOnly 'io.opentelemetry:opentelemetry-sdk:1.67.0'
    compileOnly 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.67.0'

    // Bundled into the extension JAR: the agent provides none of this.
    implementation 'dev.openfeature:sdk:1.23.0'
    implementation('dev.openfeature.contrib.providers:flagd:0.15.0') {
        // The agent supplies opentelemetry-api at runtime, and relocates the
        // io.opentelemetry references inside extension classes to match. A
        // second copy shipped in here would be a different set of classes.
        exclude group: 'io.opentelemetry'
    }
    // The opt-in tracing hook for the extension's own evaluations
    // (OTELFEATURE_OPENFEATURE_TRACING_HOOK, see EvaluationTracing). Its
    // opentelemetry-api is the agent's, as above; the semconv constants it
    // reads are bundled and relocated (shadowJar below).
    implementation('dev.openfeature.contrib.hooks:otel:3.3.1') {
        exclude group: 'io.opentelemetry'
    }
    // The flagd provider logs through SLF4J. Without a binding it prints a
    // "no providers found" warning and silently discards its own diagnostics;
    // route it to JUL, which is what the rest of this extension already uses.
    runtimeOnly 'org.slf4j:slf4j-jdk14:2.0.20'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'io.opentelemetry:opentelemetry-api:1.67.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk:1.67.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.67.0'
    // Drives the real autoconfigure path (SPI discovery, otel.sdk.disabled) in tests.
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:1.67.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.67.0'
}

// The thin JAR would otherwise compete with shadowJar for the same file name.
jar {
    archiveClassifier = 'thin'
}

shadowJar {
    archiveClassifier = ''
    archiveFileName = 'otelfeature-java-extension.jar'

    // Must come before mergeServiceFiles(): shadow's default EXCLUDE strategy
    // drops duplicate entries before the service-file transformer ever sees
    // them, which silently reduces META-INF/services/io.grpc.NameResolverProvider
    // to whichever dependency happened to be copied first - losing gRPC's DNS
    // resolver, and with it the ability to resolve "flagd:8015" at all.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()

    // The agent remaps io.opentelemetry.semconv in extension classes to its
    // own shaded copy, which need not hold the incubating 1.28 constants the
    // tracing hook was compiled against. Our own copy, under our own name,
    // is out of the remapper's reach.
    relocate 'io.opentelemetry.semconv', 'io.otelfeature.shaded.io.opentelemetry.semconv'

    // Nothing may ship under io/opentelemetry/: the API is the agent's, and
    // anything else there (semconv without the relocation above) would be
    // remapped by the agent to classes it may not have.
    doLast {
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip ->
            def leaked = zip.entries().collect { it.name }.findAll { it.startsWith('io/opentelemetry/') }
            if (leaked) {
                throw new GradleException("shadowJar bundles ${leaked.size()} entries under io/opentelemetry/,"
                        + " e.g. ${leaked.take(3)}")
            }
        }
    }
}

// So `gradle build` produces the extension JAR, not just the thin one.
assemble.dependsOn shadowJar

test {
    useJUnitPlatform()
}
